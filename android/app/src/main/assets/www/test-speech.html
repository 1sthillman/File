<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürekli Mikrofon Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        
        .mic-button:active {
            transform: scale(0.95);
        }
        
        .mic-button.listening {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
            }
            50% {
                box-shadow: 0 10px 50px rgba(245, 87, 108, 0.8);
            }
        }
        
        .status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 16px;
            color: #666;
            min-height: 24px;
        }
        
        .status.active {
            color: #f5576c;
            font-weight: 600;
        }
        
        .transcript-box {
            background: #f7f9fc;
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
            margin-bottom: 20px;
        }
        
        .transcript-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .transcript-text {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            word-wrap: break-word;
        }
        
        .partial-text {
            color: #999;
            font-style: italic;
        }
        
        .results-box {
            background: #f0f4ff;
            border-radius: 12px;
            padding: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .result-item {
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .result-item:last-child {
            margin-bottom: 0;
        }
        
        .info-text {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Sürekli Mikrofon</h1>
        
        <button class="mic-button" id="micBtn">🎙️</button>
        
        <div class="status" id="status">Başlamak için mikrofona tıklayın</div>
        
        <div class="transcript-box">
            <div class="transcript-label">Anlık Transkript</div>
            <div class="transcript-text" id="partialText">
                <span class="partial-text">Konuşmaya başlayın...</span>
            </div>
        </div>
        
        <div class="results-box" id="results">
            <div class="transcript-label">Sonuçlar</div>
            <p style="color: #999; font-size: 14px; text-align: center;">Henüz sonuç yok</p>
        </div>
        
        <div class="info-text">
            ℹ️ Mikrofon bir kere açılır ve sürekli dinler.<br>
            Bip sesi yoktur, açılıp kapanma olmaz.<br>
            Gemini ve ChatGPT gibi kesintisiz deneyim.
        </div>
    </div>
    
    <script src="./speech-continuous.js"></script>
    <script>
        let speech = null;
        let resultsCount = 0;
        
        // DOM elementleri
        const micBtn = document.getElementById('micBtn');
        const status = document.getElementById('status');
        const partialText = document.getElementById('partialText');
        const resultsBox = document.getElementById('results');
        
        // Sürekli mikrofon sistemi başlat
        function initSpeech() {
            speech = new ContinuousSpeech();
            
            // Callback'leri ayarla
            speech.onStart = () => {
                console.log('✅ Dinleme başladı');
                status.textContent = '🎤 Dinleniyor... (Sürekli mod)';
                status.classList.add('active');
                micBtn.classList.add('listening');
            };
            
            speech.onPartial = (text) => {
                console.log('📝 Anlık:', text);
                partialText.innerHTML = `<span class="partial-text">${text}</span>`;
            };
            
            speech.onResult = (text) => {
                console.log('✅ Sonuç:', text);
                addResult(text);
                partialText.innerHTML = '<span class="partial-text">Konuşmaya devam edin...</span>';
            };
            
            speech.onEnd = () => {
                console.log('⏹️ Dinleme durduruldu');
                status.textContent = 'Durduruldu';
                status.classList.remove('active');
                micBtn.classList.remove('listening');
            };
            
            speech.onError = (error) => {
                console.error('❌ Hata:', error);
                status.textContent = `Hata: ${error}`;
                status.classList.remove('active');
            };
        }
        
        // Sonuç ekle
        function addResult(text) {
            if (resultsCount === 0) {
                resultsBox.innerHTML = '<div class="transcript-label">Sonuçlar</div>';
            }
            
            resultsCount++;
            const item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML = `<strong>#${resultsCount}</strong>: ${text}`;
            resultsBox.appendChild(item);
            
            // En son sonuca kaydır
            resultsBox.scrollTop = resultsBox.scrollHeight;
        }
        
        // Mikrofon butonu
        micBtn.addEventListener('click', () => {
            if (!speech) {
                initSpeech();
            }
            
            if (speech.getIsListening()) {
                // Durdur
                speech.stop();
            } else {
                // Başlat
                speech.start();
            }
        });
        
        // Sayfa yüklendiğinde
        window.addEventListener('load', () => {
            console.log('🚀 Uygulama hazır');
            
            // Otomatik başlatma istiyorsanız:
            // initSpeech();
            // speech.start();
        });
    </script>
</body>
</html>
