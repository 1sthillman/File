<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b9468"/>
      <stop offset="100%" stop-color="#2bd4b0"/>
    </linearGradient>
    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ff3b30" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#054531" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle glow circle -->
  <circle cx="256" cy="230" r="170" fill="rgba(255,255,255,0.12)"/>

  <!-- Main Card / Terminal Shape -->
  <g filter="url(#shadow)">
    <!-- Produce Box / Crate / Terminal base -->
    <rect x="106" y="116" width="300" height="280" rx="40" fill="#ffffff"/>
  </g>

  <!-- Barcode Lines inside Card -->
  <g fill="#0b9468">
    <rect x="156" y="160" width="16" height="110" rx="4"/>
    <rect x="184" y="160" width="8"  height="110" rx="3"/>
    <rect x="202" y="160" width="22" height="110" rx="4"/>
    <rect x="234" y="160" width="12" height="110" rx="3"/>
    <rect x="256" y="160" width="26" height="110" rx="4"/>
    <rect x="292" y="160" width="10" height="110" rx="3"/>
    <rect x="312" y="160" width="18" height="110" rx="4"/>
    <rect x="340" y="160" width="16" height="110" rx="4"/>
  </g>

  <!-- Red Laser Scanner Beam -->
  <rect x="136" y="210" width="240" height="6" rx="3" fill="url(#scannerGrad)"/>
  <circle cx="256" cy="213" r="5" fill="#ff3b30"/>

  <!-- Badge / Apple Produce Motif at bottom -->
  <g transform="translate(186, 290)">
    <!-- Shopping bag / Produce Basket icon -->
    <rect x="20" y="24" width="100" height="56" rx="14" fill="#0b9468"/>
    <!-- Handles -->
    <path d="M 45 24 C 45 6, 95 6, 95 24" fill="none" stroke="#0b9468" stroke-width="8" stroke-linecap="round"/>
    <!-- Produce Leaf inside -->
    <circle cx="70" cy="52" r="12" fill="#2bd4b0"/>
    <path d="M 70 38 Q 78 32, 84 34" fill="none" stroke="#2bd4b0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Corner Status Indicator -->
  <circle cx="366" cy="156" r="10" fill="#2bd4b0"/>
</svg>
